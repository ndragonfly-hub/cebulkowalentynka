<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💘 Cebulki</title>

  <style>
    :root{
      --bg:#7A0B25;        /* ciemniejsze, mniej “po oczach” */
      --card:#4C0519;
      --text:#FFF1F2;
      --muted: rgba(255,241,242,0.82);

      --green1:#16a34a;
      --green2:#22c55e;

      --red1:#b91c1c;
      --red2:#ef4444;

      --pink1:#FB7185;
      --pink2:#FDA4AF;

      --shadow: rgba(0,0,0,0.45);
      --border: rgba(255,241,242,0.18);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: var(--bg);
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-25%;
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(255,241,242,0.14), transparent 62%),
        radial-gradient(900px 600px at 80% 85%, rgba(251,113,133,0.16), transparent 62%);
      filter: blur(10px);
      pointer-events:none;
      opacity: 0.95;
    }

    .card{
      width:min(720px, 94vw);
      border:1px solid var(--border);
      background: rgba(76, 5, 25, 0.92);
      border-radius:22px;
      padding:26px 18px 20px;
      box-shadow: 0 18px 60px var(--shadow);
      backdrop-filter: blur(10px);
      text-align:center;
      position:relative;
      z-index:1;
    }

    .view{ display:none; }
    .view.active{ display:block; animation: fadeUp .28s ease-out; }
    @keyframes fadeUp{
      from{ opacity:0; transform: translateY(8px); }
      to{ opacity:1; transform: translateY(0); }
    }

    h1{
      margin: 4px 0 10px;
      font-size: 26px;
      line-height:1.2;
      letter-spacing:0.2px;
      color:#fff;
    }

    .subtitle{
      margin:4px 0 16px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
    }

    .tip{
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255,241,242,0.75);
    }

    .btns{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 12px;
    }

    button{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      min-width: 210px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover{ filter: brightness(1.03); }
    button:active{ transform: translateY(1px) scale(0.99); }

    .yes{
      background: linear-gradient(90deg, var(--green1), var(--green2));
      color:#06210f;
    }
    .red{
      background: linear-gradient(90deg, var(--red1), var(--red2));
      color:#240606;
    }

    /* Ekran 2 */
    .openWrap{
      margin: 6px auto 0;
      display:grid;
      place-items:center;
      gap:12px;
    }
    .openCard{
      width:min(460px, 92%);
      padding:18px 16px;
      border-radius:18px;
      border:1px solid rgba(255,241,242,0.20);
      background: rgba(94, 8, 30, 0.45);
      box-shadow: 0 18px 60px rgba(0,0,0,0.30);
    }
    .openBtn{
      width:min(460px, 92%);
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,241,242,0.22);
      background: linear-gradient(135deg, var(--pink1), var(--pink2));
      color:#2a0610;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }

    /* Ekran 3: serce */
    .loveWrap{
      margin: 12px auto 10px;
      width:min(420px, 90%);
      display:grid;
      place-items:center;
      gap:10px;
    }

    .heartBox{
      width: 320px;
      height: 300px;
      position:relative;
      filter: drop-shadow(0 16px 40px rgba(0,0,0,0.45));
    }

    /* Warstwa serca (tło + połysk) */
    .heartBg{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.65), transparent 40%),
        linear-gradient(135deg, var(--pink1), var(--pink2));
      clip-path: path("M160 290C160 290 20 200 20 120C20 55 65 20 120 20C145 20 165 32 160 60C155 32 175 20 200 20C255 20 300 55 300 120C300 200 160 290 160 290Z");
      border-radius: 24px; /* fallback */
      overflow:hidden;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.04); }
    }

    /* Zdjęcie jako IMG, maskowane sercem */
    .heartImg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      /* Najważniejsze: tu ustawiasz kadr */
      object-position: 50% 30%;
      clip-path: path("M160 290C160 290 20 200 20 120C20 55 65 20 120 20C145 20 165 32 160 60C155 32 175 20 200 20C255 20 300 55 300 120C300 200 160 290 160 290Z");
      border-radius: 24px; /* fallback */
      opacity:0;
      transform: scale(1.02);
      transition: opacity 650ms ease, transform 650ms ease;
      filter: saturate(1.03) contrast(1.03);
    }

    .showPhoto .heartImg{
      opacity:1;
      transform: scale(1);
    }

    /* Połysk bez “plamy” */
    .shine{
      position:absolute;
      inset:-55%;
      background: linear-gradient(120deg, transparent 45%, rgba(255,255,255,0.33) 50%, transparent 55%);
      transform: rotate(12deg);
      animation: shine 2.2s linear infinite;
      pointer-events:none;
      mix-blend-mode: screen;
      opacity:0.85;
    }
    @keyframes shine{
      from{ transform: translateX(-40%) rotate(12deg); }
      to{ transform: translateX(40%) rotate(12deg); }
    }

    .msg{
      margin-top: 8px;
      font-size: 16px;
      line-height:1.5;
      color: rgba(255,241,242,0.95);
    }
    .sign{
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,241,242,0.80);
    }

    /* Latające serduszka */
    .hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.36;
      z-index:0;
    }
    .float-heart{
      position:absolute;
      bottom:-30px;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    }
    @keyframes floatUp{
      from{ transform: translateY(0); opacity:0; }
      10%{ opacity:1; }
      to{ transform: translateY(-120vh); opacity:0; }
    }

    @media (max-width: 420px){
      .heartBox{ width: 280px; height: 270px; }
    }
  </style>
</head>

<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">
    <!-- EKRAN 1 -->
    <section id="viewAsk" class="view active">
      <h1>Moje Drogie Cebulki! 
        <p class="subtitle">Czy zostaniecie moją Walentynką?</p>

      <div class="btns">
        <button class="yes" id="btnYes">Tak</button>
        <button class="red" id="btnRed">Tak, ale czerwone</button>
      </div>

      <div class="tip">Tylko jedna odpowiedź jest prawidłowa.</div>
    </section>

    <!-- EKRAN 2 -->
    <section id="viewOpen" class="view">
      <h1>Ufff, dobrze wybraliście!</h1>

      <div class="openWrap">
        <div class="openCard">📩 Macie 1 nową wiadomość od: Ciocia Natalia</div>
        <button class="openBtn" id="btnOpen">Otwórzcie Walentynkę</button>
      </div>
    </section>

    <!-- EKRAN 3 -->
    <section id="viewLove" class="view">
      <div class="loveWrap" aria-hidden="true">
        <div id="heartBox" class="heartBox">
          <div class="heartBg">
            <div class="shine"></div>
          </div>

          <!-- ważne: plik photo2.jpg w repo -->
          <img class="heartImg" src="photo2.jpg" alt="Zdjęcie Alicji i Oliwka" />
        </div>
      </div>

      <div class="msg">
        Trzymajcie się, moje Cebulki. <br/>
        Bardzo Was kocham i tęsknię!
      </div>

      <div class="sign">— Ciocia Natalia 💘</div>
    </section>
  </main>

  <script>
    const heartsWrap = document.querySelector(".hearts");

    const viewAsk = document.getElementById("viewAsk");
    const viewOpen = document.getElementById("viewOpen");
    const viewLove = document.getElementById("viewLove");

    const btnYes = document.getElementById("btnYes");
    const btnRed = document.getElementById("btnRed");
    const btnOpen = document.getElementById("btnOpen");

    const heartBox = document.getElementById("heartBox");

    btnYes.addEventListener("click", goOpen);
    btnRed.addEventListener("click", goOpen);
    btnOpen.addEventListener("click", goLove);

    function goOpen(){
      viewAsk.classList.remove("active");
      viewOpen.classList.add("active");
      burstHearts(10);
    }

    function goLove(){
      viewOpen.classList.remove("active");
      viewLove.classList.add("active");

      // Najpierw różowe serce, potem zdjęcie
      heartBox.classList.remove("showPhoto");
      setTimeout(() => heartBox.classList.add("showPhoto"), 650);

      burstHearts(18);
      setInterval(() => spawnHeart(randomEmoji()), 800);
    }

    function randomEmoji(){
      const emojis = ["❤️","💗","💖","💘","💞"];
      return emojis[Math.floor(Math.random()*emojis.length)];
    }

    function burstHearts(count){
      for(let i=0;i<count;i++){
        setTimeout(() => spawnHeart(randomEmoji()), i*60);
      }
    }

    function spawnHeart(char){
      const el = document.createElement("div");
      el.className = "float-heart";
      el.textContent = char;

      const x = Math.random() * window.innerWidth;
      const size = 14 + Math.random() * 18;
      const dur = 3 + Math.random() * 3;

      el.style.left = x + "px";
      el.style.fontSize = size + "px";
      el.style.animationDuration = dur + "s";

      heartsWrap.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000);
    }
  </script>
</body>
</html>
